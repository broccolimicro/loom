title:            Loom
longtitle:        Loom Language Documentation
author:           Edward Bingham
email:            edward.bingham@broccolimicro.io
description: >
  Synthesize quasi-delay-insensitive circuits.

#remote_theme: sighingnow/jekyll-gitbook
#theme: jekyll-gitbook
#theme_dir: _themes
extra_css: extra.css

toc:
  enabled: true
  h_min: 1
  h_max: 3

tracker:
  google_analytics: "G-FT6E284Y58"

markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: github

markdown_ext:             markdown,mkdown,mkdn,mkd,md

collections:
  tutorial:
    label: Tutorial
    output: true
    permalink: /:collection/:title:output_ext
  guide:
    label: Guide
    output: true
    permalink: /:collection/:title:output_ext
  explain:
    label: Explanation
    output: true
    permalink: /:collection/:title:output_ext
  reference:
    label: Reference
    output: true
    permalink: /:collection/:title:output_ext
  lang:
    label: Languages
    output: true
    permalink: /:collection/:title:output_ext
  hse:
    label: HSE
    output: true
    permalink: /:collection/:title:output_ext

ordered_collections:
  - tutorial
  - guide
  - explain
  - reference
  - lang
  - hse

#permalink:                /:categories/:title:output_ext
# Use pretty permalinks (removes .html extension)
permalink:                pretty

# Collections are not needed - using standard directory structure
# The jekyll-gitbook theme works with standard pages and directories
